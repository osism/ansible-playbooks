---
# Write the keyrings of the given Ceph entities to /etc/ceph on every monitor
# host. Included on the manager, where `ceph` is the cephclient wrapper.
#
# Input:
#   _write_mon_keyrings_keys: a list of {name, mode}; mode defaults to 0600.
#
# The keyrings are read from the monitors here, at the time of writing, and
# never taken from the caller: a keyring the caller read earlier may already
# be stale (a rotation in between), and the copy-ceph-keys play takes
# whatever /etc/ceph on the first monitor holds into the configuration
# repository.
#
# Each file carries the key in force next: while a rotation is staged
# `ceph auth get` also prints a `pending key` line, which Ceph clients cannot
# read ("Malformed input"), so the pending key (if any) is written as the
# `key` and the `pending key` line is dropped (cephx_keyring).
#
# The files are written from the manager with delegate_to, one loop item per
# host and keyring, so that a failure on any host fails this task and the
# run. Every monitor host must hold the same keyrings; a host skipped
# silently would keep a stale key.

- name: Read the keyrings
  ansible.builtin.command:
    cmd: "ceph auth get {{ item.name }}"
  loop: "{{ _write_mon_keyrings_keys }}"
  loop_control:
    label: "{{ item.name }}"
  register: _write_mon_keyrings_read
  changed_when: false
  # Judged by the next task, which masks stderr: stdout carries the key.
  failed_when: false
  no_log: true

# A failed or odd command can print something that is not a keyring;
# writing that to the monitors would hand it to copy-ceph-keys. The loop
# item is the entry of _write_mon_keyrings_keys, never the registered
# result: a failed item's result is shown, and the read's stdout carries
# the key.
- name: Fail if a keyring cannot be read
  ansible.builtin.fail:
    msg: >-
      ceph auth get {{ item.name }}
      {{ _read | cephx_failed('ceph auth get') or 'did not return the keyring of the entity' }}.
      The keyrings were not written to the monitor hosts.
  vars:
    _read: "{{ _write_mon_keyrings_read.results[_index] }}"
  loop: "{{ _write_mon_keyrings_keys }}"
  loop_control:
    index_var: _index
    label: "{{ item.name }}"
  when: >-
    _read.rc != 0
    or (_read.stdout_lines | first | default('')) != '[' ~ item.name ~ ']'

- name: Normalise the keyrings  # noqa osism-fqcn
  cephx_keyring:
    keyring: "{{ item.stdout }}"
    want_normalised: true
  loop: "{{ _write_mon_keyrings_read.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  register: _write_mon_keyrings_normalised
  changed_when: false
  # The result carries the key.
  no_log: true

- name: Create /etc/ceph on the monitor hosts
  become: true
  ansible.builtin.file:
    path: /etc/ceph
    state: directory
    owner: root
    group: root
    mode: "0755"
  delegate_to: "{{ item }}"
  loop: "{{ groups[mon_group_name | default('ceph-mon')] }}"

- name: Write each keyring to the monitor hosts
  become: true
  ansible.builtin.copy:
    content: "{{ item.1.normalised_lines | join('\n') ~ '\n' }}"
    dest: "/etc/ceph/ceph.{{ item.1.item.item.name }}.keyring"
    owner: root
    group: root
    mode: "{{ item.1.item.item.mode | default('0600') }}"
  delegate_to: "{{ item.0 }}"
  loop: >-
    {{ groups[mon_group_name | default('ceph-mon')]
       | product(_write_mon_keyrings_normalised.results) | list }}
  loop_control:
    label: "{{ item.0 }}: {{ item.1.item.item.name }}"
  register: _write_mon_keyrings_written
  # The content is the key.
  no_log: true

# no_log hides the loop labels above, so say per host which keyrings changed.
- name: Report the keyrings changed on each monitor host
  ansible.builtin.debug:
    msg: "{{ item }}: {{ _changed | join(', ') if _changed else 'no keyring changed' }}"
  vars:
    _changed: >-
      {{ _write_mon_keyrings_written.results
         | selectattr('item.0', 'equalto', item)
         | selectattr('changed')
         | map(attribute='item.1.item.item.name')
         | list }}
  loop: "{{ groups[mon_group_name | default('ceph-mon')] }}"
