---
# Deploy Ceph with cephadm: carry the configuration into the mon config store.
#
# ceph_conf_overrides is a ceph-ansible variable: it is rendered into
# /etc/ceph/ceph.conf on each host, keyed by that host's daemon name. Under
# cephadm, radosgw and the other daemons are configured through the monitor
# configuration database instead of a ceph.conf
# (https://docs.ceph.com/en/reef/cephadm/services/rgw/), so the same values have
# to be written there, with two spelling changes.
- name: Translate the Ceph configuration into the config store
  hosts: manager
  gather_facts: false

  environment:
    INTERACTIVE: "false"

  tasks:
    # cephadm-bootstrap.yml passes --skip-mon-network, because bootstrap's own
    # inference searches route-derived networks for one containing the mon
    # address and a host-scoped /32 is in none of them. So the networks are
    # stated here instead. This is not only a routed-topology fix: on every
    # topology it makes the cluster use the operator's configured value rather
    # than whatever bootstrap deduced from the routing table of the one host it
    # happened to run on.
    #
    # Written before the ceph_conf_overrides translation below, and before
    # cephadm-mons places the remaining mons and cephadm-osds the OSDs, both of
    # which need public_network/cluster_network to be set already.
    - name: Fail when public_network is not set
      ansible.builtin.fail:
        msg: >-
          public_network is not set. It is written to the mon config store here
          because cephadm-bootstrap.yml skips network inference; without it the
          mons and OSDs have no configured network to bind.
      when: public_network | default('') | length == 0

    - name: Set the cluster networks in the config store
      ansible.builtin.command:
        argv:
          - ceph
          - config
          - set
          - global
          - "{{ item.option }}"
          - "{{ item.value }}"
      loop:
        - option: public_network
          value: "{{ public_network }}"
        - option: cluster_network
          value: "{{ cluster_network | default(public_network) }}"
      loop_control:
        label: "{{ item.option }}={{ item.value }}"
      changed_when: true

    # subelements requires the sub-key to name a LIST, and ceph_conf_overrides
    # holds a mapping of section -> mapping of option. Convert the inner
    # mapping first; passing it directly raises
    # "the key 'value' should point to a list".
    - name: Turn each section's options into a list
      ansible.builtin.set_fact:
        _cephadm_sections: >-
          {{ _cephadm_sections | default([]) + [{
               'section': item.key,
               'options': item.value | dict2items,
             }] }}
      loop: "{{ ceph_conf_overrides | default({}) | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      # Stays blanket, unlike the two tasks below. Its result is a whole
      # SECTION's options as one structure, so there is no per-option
      # granularity to narrow to, and a set_fact that only reshapes data cannot
      # fail in a way whose message would be worth reading.
      no_log: true

    - name: Build the config-store entries
      ansible.builtin.set_fact:
        _cephadm_config_entries: >-
          {{ _cephadm_config_entries | default([]) + [{
               'section': _section,
               'option': item.1.key | replace(' ', '_'),
               'value': _value,
             }] }}
      vars:
        # ceph-ansible templates one section per RGW daemon, named for the host
        # and instance it runs on. cephadm names its daemons differently and
        # keeps configuration centrally, where a single client.rgw section is
        # inherited by every RGW daemon.
        #
        # This collapse is valid ONLY in the config store. In a ceph.conf,
        # resolution honours [global], the daemon type and the exact entity name
        # and nothing in between, so a [client.rgw] section there is ignored —
        # measured: rgw_s3_auth_use_keystone resolves false under [client.rgw]
        # and true under the exact daemon section. Do not "simplify" the
        # ceph-ansible side to match this.
        #
        # It also has to collapse: this play runs on `hosts: manager`, so the
        # per-daemon section name that cfg-cookiecutter and the Ceph
        # configuration guide use (`client.rgw.{{ rgw_zone }}.{{
        # hostvars[inventory_hostname]['ansible_hostname'] }}.rgw0`) renders
        # with the MANAGER's hostname, not any RGW daemon's -- the rendered
        # input section name is meaningless here. It reads correctly only
        # because the collapse below discards it. Narrowing the collapse to
        # "preserve per-daemon sections" would produce
        # `client.rgw.<zone>.<manager>.rgw0` and silently de-integrate
        # keystone.
        _section: >-
          {{ 'client.rgw' if item.0.section.startswith('client.rgw') else item.0.section }}
        # YAML booleans render as Python's True/False; ceph wants true/false.
        _value: >-
          {{ item.1.value | string | lower if item.1.value is boolean
             else item.1.value | string }}
      loop: "{{ _cephadm_sections | default([]) | subelements('options') }}"
      loop_control:
        label: "{{ item.0.section }}/{{ item.1.key }}"
      # Narrowed: censor only the entries whose VALUE is a secret. no_log is
      # templated per item in a loop, so the rest stay readable. See the note on
      # the next task for why that matters.
      no_log: "{{ item.1.key is search('password|secret|token') }}"

    # argv, not cmd: several of these values contain spaces — "swift, s3, admin"
    # for rgw_enable_apis and "member, admin" for the accepted keystone roles —
    # and `command` splits a cmd string on whitespace, which would pass each
    # fragment as its own argument.
    - name: Write the entries to the config store
      ansible.builtin.command:
        argv:
          - ceph
          - config
          - set
          - "{{ item.section }}"
          - "{{ item.option }}"
          - "{{ item.value }}"
      loop: "{{ _cephadm_config_entries | default([]) }}"
      loop_control:
        # Values include the keystone admin password.
        label: "{{ item.section }}/{{ item.option }}"
      # Narrowed from a blanket no_log to just the secret-valued entries.
      # `ceph config set` rejects an option the running release has removed with
      # `Error EINVAL: unrecognized config option '<name>'`, and under a blanket
      # no_log the failure reads only "the output has been hidden" -- naming
      # neither the option nor the reason. That cost a 2.5 hour run plus manual
      # bisection of 24 options to identify `rgw keystone api version` on
      # Tentacle. Only the password entry needs hiding; everything else should
      # say what went wrong.
      no_log: "{{ item.option is search('password|secret|token') }}"
      changed_when: true

    # OSISM configures the mgr module set explicitly: osism/defaults
    # all/099-ceph.yml sets ceph_mgr_modules to ceph_mgr_modules_defaults +
    # ceph_mgr_modules_extra. ceph-ansible applies that list in its ceph-mgr
    # role; cephadm has no equivalent, so it is applied here.
    - name: Read the mgr module list
      ansible.builtin.command:
        cmd: ceph mgr module ls --format=json
      register: _cephadm_mgr_module_ls
      changed_when: false

    # Enable only. ceph-ansible ALSO disables every enabled module that is not
    # in ceph_mgr_modules, converging the set in both directions. That half
    # cannot be ported: a cephadm cluster runs the `cephadm` module itself and
    # it is not in OSISM's list, so converging downward here would disable the
    # orchestrator and take the cluster's management plane down.
    #
    # Always-on modules are skipped. Enabling one that is genuinely on is not
    # an error -- the monitor reports "already enabled (always-on)" and returns
    # 0 -- so for the ordinary case this is only about an honest changed flag
    # and two fewer calls. There is one case where it does matter: a module an
    # operator has explicitly `force disable`d is still listed under
    # always_on_modules by `mgr module ls` (observed on v18.2.8), so enabling
    # it here would undo that operator decision. Skipping the always-on set
    # leaves it disabled.
    #
    # The `dashboard` module is in this list, so it is switched on here, but it
    # is not configured until the cephadm-dashboard play later in the walk. The
    # gap is harmless: with no server_addr/server_port in the config store the
    # module cannot bind a listener, so it simply polls until configured.
    - name: Enable the configured mgr modules
      ansible.builtin.command:
        cmd: "ceph mgr module enable {{ item }}"
      loop: "{{ ceph_mgr_modules | default([]) }}"
      when:
        - item not in _cephadm_mgr_modules_now.always_on_modules
        - item not in _cephadm_mgr_modules_now.enabled_modules
      vars:
        _cephadm_mgr_modules_now: "{{ _cephadm_mgr_module_ls.stdout | from_json }}"
      register: _cephadm_mgr_modules_enabled
      changed_when: true

    # Enabling a module respawns the active manager -- Ceph's mgr logs
    # "respawning because set of enabled modules changed!" -- and the
    # orchestrator goes down with it. The next play in this sequence drives
    # `ceph orch`, so wait for it rather than letting that play fail
    # intermittently. A handler would not do: it runs at the end of THIS
    # play, but the orchestrator has to be back before the NEXT play
    # starts, so it must be an ordinary conditional task here.
    - name: Wait for the orchestrator to come back  # noqa: no-handler
      ansible.builtin.command:
        cmd: ceph orch status
      register: _cephadm_orch_back
      until: _cephadm_orch_back.rc == 0 and 'cephadm' in _cephadm_orch_back.stdout
      retries: 30
      delay: 10
      changed_when: false
      when: _cephadm_mgr_modules_enabled.changed
