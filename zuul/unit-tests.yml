---
- name: Run unit tests
  hosts: all

  vars:
    python_venv_dir: /tmp/venv

  tasks:
    - name: Install Python venv support
      become: true
      ansible.builtin.apt:
        name:
          - python3-pip
          - python3-venv
        update_cache: true

    - name: Install pytest and ansible-core (the modules import it) into a virtual environment
      ansible.builtin.pip:
        name:
          - pytest
          - ansible-core>=2.18,<2.19
        virtualenv: "{{ python_venv_dir }}"
        virtualenv_command: "python3 -m venv"

    - name: Run pytest
      ansible.builtin.command:
        cmd: "{{ python_venv_dir }}/bin/python3 -m pytest tests/unit"
        chdir: "{{ zuul.project.src_dir }}"
      changed_when: false
